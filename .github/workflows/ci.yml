name: Samen x64 kernel and filesystem

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Rust filesystem and QOI unit tests
        run: make test
      - name: Build x64 freestanding kernel
        run: make kernel
  bare-metal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Install boot and emulator tools
        run: sudo apt-get update && sudo apt-get install -y xorriso qemu-system-x86 make
      - name: Filesystem unit tests
        run: make test
      - name: Build freestanding x64 ELF and bootable ISO
        run: make iso
      - name: QEMU cold boot and three-boot disk persistence check
        run: make test-qemu

      - name: Verify graphical framebuffer and PS/2 pointer interaction
        run: make test-gui
      - name: Publish tested ISO to rolling development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view samen-dev >/dev/null 2>&1; then
            gh release create samen-dev --target "$GITHUB_SHA" \
              --title "Samen development boot ISO" --prerelease \
              --notes "Bootable x86-64 Rust Samen OS ISO. Raw SamenFS1 data disk is generated separately by make disk."
          fi
          gh release upload samen-dev build/Samen.iso --clobber
